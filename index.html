<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tanz im Dschungel</title>
<meta name="theme-color" content="#E7EBDE" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Dschungel" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="mobile-web-app-capable" content="yes" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Karla:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#E7EBDE; --card:#FAFBF3; --ink:#1B2A20; --soft:#5F6E5F;
  --green:#33604A; --stem:#8AA57C; --bloom:#A8436A; --line:#C9D2BC;
}
*{box-sizing:border-box;}
html,body{margin:0; background:var(--paper);}
body{
  color:var(--ink); font-family:'Karla',ui-sans-serif,system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  padding:20px 16px calc(40px + env(safe-area-inset-bottom));
  max-width:760px; margin:0 auto; min-height:100vh;
}
h1{font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:30px; margin:0; letter-spacing:-.01em;}
h2{font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:21px; margin:0 0 2px;}
h3{font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:17px; margin:0;}
p{margin:0 0 10px;}
button{font-family:inherit; font-size:14px; cursor:pointer;}
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--bloom); outline-offset:2px;}
input,textarea,select{font-family:inherit; font-size:15px; padding:9px 11px; border:1px solid var(--line);
  border-radius:3px; background:var(--card); color:var(--ink); min-width:0;}
input,textarea{flex:1; width:100%;}
input[type=time]{flex:0 0 auto; width:auto;}
input[type=checkbox]{flex:none; width:17px; height:17px; accent-color:var(--green);}
select{font-size:14px; padding:8px 10px; max-width:100%;}

.boot{padding:60px 0; color:var(--soft);}
.gate{padding:32px 0;}
.gate .lead{color:var(--soft); max-width:46ch; margin-bottom:22px;}
.gate h2{margin:22px 0 10px;}
.gateLabel{font-size:13px; color:var(--soft); margin:18px 0 8px;}
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 14px; color:var(--ink);}
.chip:hover{border-color:var(--green);}

.top{margin-bottom:18px;}
.topline{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px;}
.who{background:none; border:none; color:var(--green); font-weight:600; padding:0; text-align:right;}
.whoHint{color:var(--soft); font-weight:400; font-size:12px; margin-left:6px;}

.ribbon{margin-bottom:22px; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:12px 12px 8px;}
.ribLabel{font-size:12px; color:var(--soft); margin-bottom:4px;}
.ribRow{display:flex; gap:2px; margin-bottom:10px;}
.seg{flex:1 1 0; height:26px; border:none; border-radius:2px; position:relative; color:var(--ink); font-size:11px; padding:0;}
.seg span{position:absolute; left:4px; top:6px; opacity:.75;}
.seg.leer{background:#DDE3D2;}
.seg.halb{background:var(--stem);}
.seg.voll{background:var(--green); color:#F2F5EC;}
.ribScale{display:flex; justify-content:space-between; font-size:11px; color:var(--soft); border-top:1px solid var(--line); padding-top:5px;}

.tabs{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
  gap:8px; margin:20px 0 24px;}
.tab{background:var(--card); border:1px solid var(--line); border-radius:999px;
  padding:12px 14px; font-size:16px; color:var(--ink); text-align:center;}
.tab.on{background:var(--green); border-color:var(--green); color:#F4F7EE; font-weight:600;}
.badge{display:inline-block; margin-left:7px; background:var(--stem); color:#1B2A20;
  border-radius:999px; font-size:12px; padding:1px 7px;}
.tab.on .badge{background:rgba(244,247,238,.28); color:#F4F7EE;}

.block{margin-bottom:26px;}
.hint{color:var(--soft); font-size:13px;}
.tally{color:var(--green); font-weight:600; margin-bottom:16px;}
.empty{color:var(--soft); font-style:italic; padding:10px 0; list-style:none;}
.sub{margin:18px 0 6px; color:var(--soft);}
.problem{background:#F6E2E7; border-left:3px solid var(--bloom); padding:8px 12px; font-size:14px; margin-bottom:12px;}

.slots{list-style:none; padding:0; margin:10px 0 0;}
.slot{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
  border-left:3px solid var(--line); border-radius:3px; padding:10px 12px; margin-bottom:6px;}
.slot.mine{border-left-color:var(--bloom); background:#FBF4F7;}
.slot.full{opacity:.7;}
.time{font-variant-numeric:tabular-nums; font-weight:600; min-width:104px;}
.people{flex:1; display:flex; flex-wrap:wrap; gap:6px; align-items:center;}
.people em{color:var(--soft); font-size:13px;}
.pill{background:#E3EAD8; border-radius:999px; padding:2px 9px; font-size:13px; display:inline-flex; align-items:center; gap:2px;}
.pill .weg{text-decoration:none; font-size:15px; line-height:1; padding:0 0 0 4px; color:var(--soft);}
.slotBtns{display:flex; align-items:center; gap:6px;}
.slot .addOther{flex-basis:100%; margin:8px 0 0;}
.owners{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px;
  border-top:1px solid var(--line); padding-top:10px;}
.in,.out{border-radius:3px; padding:6px 12px; border:1px solid var(--green); background:var(--green); color:#F4F7EE; white-space:nowrap;}
.out{background:none; color:var(--green);}
.in:disabled{background:none; border-color:var(--line); color:var(--soft); cursor:default;}

.row{display:flex; gap:8px; margin:10px 0;}
.row.wrap{flex-wrap:wrap;}
.grow{flex:1 1 160px;}
.form{display:flex; flex-direction:column; gap:8px; margin:10px 0 16px;}
.go{background:var(--green); color:#F4F7EE; border:1px solid var(--green); border-radius:3px; padding:9px 16px; white-space:nowrap;}
.go:disabled{background:none; color:var(--soft); border-color:var(--line); cursor:default;}
.go.wide{align-self:flex-start;}
.link{background:none; border:none; color:var(--soft); text-decoration:underline; padding:2px 4px; white-space:nowrap;}
.link:hover{color:var(--bloom);}

.cards{list-style:none; padding:0; margin:10px 0 0;}
.card{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
  border-radius:3px; padding:10px 12px; margin-bottom:6px;}
.card.edit{flex-wrap:wrap;}
.card.edit input{flex:1 1 160px;}
.card label{display:flex; align-items:center; gap:10px; flex:1; cursor:pointer;}
.card.col{flex-direction:column; align-items:stretch;}
.todoRow{display:flex; align-items:flex-start; gap:10px;}
.todoMain{flex:1; display:flex; flex-direction:column; gap:2px; background:none; border:none;
  padding:0; text-align:left; color:inherit; font-size:15px; line-height:1.4;}
.todoMain .by{white-space:normal;}
.todo.done .txt{text-decoration:line-through; color:var(--soft);}
.notes{border-top:1px solid var(--line); margin-top:10px; padding-top:10px;}
.note{padding:6px 0; border-bottom:1px solid rgba(201,210,188,.5);}
.note p{margin:0; white-space:pre-wrap;}
.noteMeta{font-size:12px; color:var(--soft);}
.noteMeta .link{font-size:12px;}
.replies{margin:8px 0 0 4px; border-left:2px solid var(--line); padding-left:10px;}
.replies .note:last-child{border-bottom:none; padding-bottom:0;}
.betrag{font-variant-numeric:tabular-nums; white-space:nowrap;}
.by{font-size:12px; color:var(--soft); white-space:nowrap;}
.group{margin-bottom:14px;}
.group h3 .link{font-size:12px; margin-left:6px;}
.count{font-family:'Karla',sans-serif; font-size:12px; color:var(--soft); font-weight:400;}
.card.ws{align-items:flex-start;}
.card.ws.col h3{margin:0;}
.card.ws > div{flex:1;}
.desc{margin:6px 0 0; max-width:62ch; white-space:pre-wrap;}

.timetable{list-style:none; padding:0; margin:14px 0 0; border-left:2px solid var(--stem);}
.timetable li{display:flex; align-items:center; gap:12px; padding:9px 0 9px 14px; position:relative;}
.timetable li.empty::before{display:none;}
.timetable li::before{content:''; position:absolute; left:-5px; top:50%; width:8px; height:8px; border-radius:50%;
  background:var(--green); transform:translateY(-50%);}
.slotTime{font-variant-numeric:tabular-nums; color:var(--soft); min-width:106px;}
.djName{flex:1; font-family:'Newsreader',Georgia,serif; font-size:18px;}

.foot{display:flex; justify-content:space-between; align-items:center; gap:10px;
  border-top:1px solid var(--line); padding-top:10px; font-size:12px; color:var(--soft); margin-top:24px;}

@media (max-width:560px){
  .slot{flex-wrap:wrap;}
  .time{min-width:auto;}
  .people{flex-basis:100%; order:3;}
  .timetable li{flex-wrap:wrap;}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div id="app"><p class="boot">Lade die Party …</p></div>

<script type="module">
/* ======================= EINSTELLUNGEN ======================= */
const SUPABASE_URL = "https://jgvkequwqvkpyqcpntvo.supabase.co";
const SUPABASE_KEY = "sb_publishable_xw8Cd5xLxAhba-y50jHe7g_S34PVoHh";
const PASSWORT     = "doppelsechs";
/* ============================================================= */

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const GUEST_LIMIT = 9;
const EINLASS = [[20,21],[21,22],[22,23],[23,24],[24,25],[25,26]];
const BAR     = [[16,18],[18,20],[20,22],[22,24],[24,26],[26,28]];
const SHIFTS = [
  ...BAR.map(s => ({ id:"b"+s[0], kind:"bar", span:s, seats:2 })),
  ...EINLASS.map(s => ({ id:"e"+s[0], kind:"einlass", span:s, seats:1 })),
];
const hh = h => String(h % 24).padStart(2,"0") + ":00";
const spanLabel = s => `${hh(s[0])} – ${hh(s[1])}`;
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

let S = { hosts:[], guests:[], signups:[], todos:[], djs:[], workshops:[], expenses:[], todoNotes:[], board:[], wsNotes:[], owners:[] };
let me = localStorage.getItem("dsch:me");
let tab = "schichten";
let ui = { editGuest:null, editHost:null, editTodo:null, openTodo:null, openWs:null, addOwnerTo:null, replyTo:null, addTo:null, busy:false, problem:null, loaded:false };
const app = document.getElementById("app");

/* ------------------------------ Daten ------------------------------ */

function withTimeout(p, ms = 15000) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}

async function attempt(fn, tries = 4) {
  let last;
  for (let i = 0; i < tries; i++) {
    try { return await withTimeout(fn()); }
    catch (e) { last = e; await new Promise(r => setTimeout(r, 400 * (i + 1))); }
  }
  throw last;
}

async function load() {
  try {
    const [h, g, s, t, d, w, x, n, b, k, o] = await attempt(() => Promise.all([
      sb.from("hosts").select("*").order("name"),
      sb.from("guests").select("*").order("created_at"),
      sb.from("shift_signups").select("*").order("created_at"),
      sb.from("todos").select("*").order("created_at"),
      sb.from("djs").select("*").order("start_time"),
      sb.from("workshops").select("*").order("created_at"),
      sb.from("expenses").select("*").order("spent_on"),
      sb.from("todo_notes").select("*").order("created_at"),
      sb.from("board_notes").select("*").order("created_at"),
      sb.from("workshop_notes").select("*").order("created_at"),
      sb.from("todo_owners").select("*").order("created_at"),
    ]));
    const err = [h,g,s,t,d,w,x,n,b,k,o].find(r => r.error);
    if (err) throw err.error;
    S = { hosts:h.data, guests:g.data, signups:s.data, todos:t.data, djs:d.data, workshops:w.data,
          expenses:x.data, todoNotes:n.data, board:b.data, wsNotes:k.data, owners:o.data };
    ui.problem = null;
  } catch (e) {
    ui.problem = "Die Daten kommen gerade nicht durch: " + (e.message || e.code || String(e));
  }
  ui.loaded = true;
  render();
}

async function write(fn) {
  if (ui.busy) return;
  ui.busy = true; render();
  try {
    const res = await attempt(fn);
    if (res && res.error) throw res.error;
    ui.problem = null;
  } catch (e) {
    ui.problem = "Speichern hat nicht geklappt: " + (e.message || e.code || String(e));
  }
  ui.busy = false;
  await load();
}

const hostName = id => S.hosts.find(h => h.id === id)?.name || "Unbekannt";
const seatsOf = sid => S.signups.filter(x => x.shift_id === sid);
const guestsOf = hid => S.guests.filter(g => g.host_id === hid);
const signupName = x => x.host_id ? hostName(x.host_id) : (x.name || "Unbekannt");
const ownersOf = id => S.owners.filter(o => o.todo_id === id);

/* ---------------------------- Aktionen ---------------------------- */

const actions = {
  async createHost(name) {
    try {
      const { data, error } = await withTimeout(sb.from("hosts").insert({ name }).select().single());
      if (error) throw error;
      me = data.id; localStorage.setItem("dsch:me", me);
      await load();
    } catch (e) {
      ui.problem = "Anlegen hat nicht geklappt: " + (e.message || e.code || String(e));
      render();
    }
  },
  claim(id) { me = id; if (id) localStorage.setItem("dsch:me", id); else localStorage.removeItem("dsch:me"); render(); },
  toggleShift(sid) {
    const shift = SHIFTS.find(s => s.id === sid);
    const mine = S.signups.find(x => x.shift_id === sid && x.host_id === me);
    if (mine) return write(() => sb.from("shift_signups").delete().eq("id", mine.id));
    if (seatsOf(sid).length >= shift.seats) return;
    return write(() => sb.from("shift_signups").insert({ shift_id: sid, host_id: me }));
  },
  addOther(shift_id, name) {
    ui.addTo = null;
    const hit = S.hosts.find(h => h.name.toLowerCase() === name.toLowerCase());
    return write(() => sb.from("shift_signups").insert(hit ? { shift_id, host_id: hit.id } : { shift_id, name }));
  },
  removeSignup(id) { return write(() => sb.from("shift_signups").delete().eq("id", id)); },
  addGuest(name) {
    if (guestsOf(me).length >= GUEST_LIMIT) return;
    return write(() => sb.from("guests").insert({ name, host_id: me }));
  },
  updateGuest(id, patch) { return write(() => sb.from("guests").update(patch).eq("id", id)); },
  deleteGuest(id) { return write(() => sb.from("guests").delete().eq("id", id)); },
  renameHost(id, name) { return write(() => sb.from("hosts").update({ name }).eq("id", id)); },
  addTodo(text) { return write(() => sb.from("todos").insert({ text, created_by: me })); },
  toggleTodo(id) {
    const t = S.todos.find(x => x.id === id);
    return write(() => sb.from("todos").update({ done: !t.done, done_by: t.done ? null : me }).eq("id", id));
  },
  deleteTodo(id) { return write(() => sb.from("todos").delete().eq("id", id)); },
  updateTodo(id, text) { return write(() => sb.from("todos").update({ text }).eq("id", id)); },
  addOwner(todo_id, name) {
    ui.addOwnerTo = null;
    const hit = S.hosts.find(h => h.name.toLowerCase() === name.toLowerCase());
    return write(() => sb.from("todo_owners").insert(hit ? { todo_id, host_id: hit.id } : { todo_id, name }));
  },
  removeOwner(id) { return write(() => sb.from("todo_owners").delete().eq("id", id)); },
  addDj(name, start_time, end_time) { return write(() => sb.from("djs").insert({ name, start_time, end_time })); },
  deleteDj(id) { return write(() => sb.from("djs").delete().eq("id", id)); },
  addWorkshop(person, title, description) { return write(() => sb.from("workshops").insert({ person, title, description })); },
  deleteWorkshop(id) { return write(() => sb.from("workshops").delete().eq("id", id)); },
  addWsNote(workshop_id, body) { return write(() => sb.from("workshop_notes").insert({ workshop_id, host_id: me, body })); },
  deleteWsNote(id) { return write(() => sb.from("workshop_notes").delete().eq("id", id)); },
  addNote(todo_id, body) { return write(() => sb.from("todo_notes").insert({ todo_id, host_id: me, body })); },
  deleteNote(id) { return write(() => sb.from("todo_notes").delete().eq("id", id)); },
  addBoardNote(body, parent_id = null) {
    ui.replyTo = null;
    return write(() => sb.from("board_notes").insert({ host_id: me, body, parent_id }));
  },
  deleteBoardNote(id) { return write(() => sb.from("board_notes").delete().eq("id", id)); },
  addExpense(host_id, what, amount, spent_on) {
    return write(() => sb.from("expenses").insert({ host_id, what, amount, spent_on }));
  },
  deleteExpense(id) { return write(() => sb.from("expenses").delete().eq("id", id)); },
};

/* ---------------------------- Ansichten ---------------------------- */

function viewPassword() {
  return `<div class="gate">
    <h1>Tanz im Dschungel</h1>
    <p class="lead">Die Seite ist für unsere Runde. Gib das Wort ein, das ihr euch geschickt habt.</p>
    <div class="row">
      <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" />
      <button class="go" data-act="pw">Rein</button>
    </div>
    <p class="hint" id="pwErr"></p>
  </div>`;
}

function viewGate() {
  const sorted = [...S.hosts].sort((a,b) => a.name.localeCompare(b.name, "de"));
  return `<div class="gate">
    <h1>Tanz im Dschungel</h1>
    <p class="lead">Sag, wer du bist. Danach steht dein Name automatisch an deinen Schichten, Gästen und To-dos.</p>
    ${ui.problem ? `<p class="problem">${esc(ui.problem)}</p>` : ""}
    ${sorted.length ? `
      <h2>Wähl dich aus</h2>
      <div class="chips">${sorted.map(h => `<button class="chip" data-act="claim" data-id="${h.id}">${esc(h.name)}</button>`).join("")}</div>
      <p class="gateLabel">Nicht dabei? Dann leg dich neu an.</p>
    ` : `<h2>Du bist die erste Person hier</h2>`}
    <div class="row">
      <input id="newHost" placeholder="Dein Name" />
      <button class="go" data-act="newHost">Loslegen</button>
    </div>
  </div>`;
}

function ribbon() {
  const seg = s => {
    const n = seatsOf(s.id).length;
    const cls = n === 0 ? "leer" : n < s.seats ? "halb" : "voll";
    return `<button class="seg ${cls}" style="flex-grow:${s.span[1]-s.span[0]}" data-act="tab" data-tab="schichten" title="${spanLabel(s.span)}"><span>${hh(s.span[0])}</span></button>`;
  };
  const row = (kind, from, to) => `<div class="ribRow" style="margin-left:${(from-16)/12*100}%; width:${(to-from)/12*100}%">
    ${SHIFTS.filter(s => s.kind === kind).map(seg).join("")}</div>`;
  return `<div class="ribbon">
    <div class="ribLabel">Bar</div>${row("bar",16,28)}
    <div class="ribLabel">Einlass</div>${row("einlass",20,26)}
    <div class="ribScale"><span>16:00</span><span>20:00</span><span>00:00</span><span>04:00</span></div>
  </div>`;
}

function viewSchichten() {
  const open = SHIFTS.reduce((n,s) => n + (s.seats - seatsOf(s.id).length), 0);
  const mine = SHIFTS.filter(s => seatsOf(s.id).some(x => x.host_id === me)).length;
  const block = (kind, title, hint) => `<section class="block">
    <h2>${title}</h2><p class="hint">${hint}</p>
    <ul class="slots">${SHIFTS.filter(s => s.kind === kind).map(s => {
      const list = seatsOf(s.id);
      const isMine = list.some(x => x.host_id === me);
      const free = s.seats - list.length;
      const full = free <= 0;
      return `<li class="slot${isMine ? " mine" : ""}${full && !isMine ? " full" : ""}">
        <span class="time">${spanLabel(s.span)}</span>
        <span class="people">
          ${list.length === 0 ? "<em>frei</em>" : list.map(x => `<span class="pill">${esc(signupName(x))}<button class="link weg" data-act="delSignup" data-id="${x.id}" title="Entfernen">×</button></span>`).join("")}
          ${list.length && free > 0 ? `<em>+${free} frei</em>` : ""}
        </span>
        <span class="slotBtns">
          <button class="${isMine ? "out" : "in"}" data-act="shift" data-id="${s.id}" ${full && !isMine ? "disabled" : ""}>
            ${isMine ? "Austragen" : full ? "Voll" : "Ich"}</button>
          ${free > 0 ? `<button class="link" data-act="addOther" data-id="${s.id}">Andere*n</button>` : ""}
        </span>
        ${ui.addTo === s.id ? `<div class="row addOther">
          <input id="otherName" placeholder="Name der Person" />
          <button class="go" data-act="saveOther" data-id="${s.id}">Eintragen</button>
          <button class="link" data-act="cancelOther">Abbrechen</button>
        </div>` : ""}
      </li>`;
    }).join("")}</ul></section>`;
  return `<p class="tally">${open === 0 ? "Alle Schichten besetzt." : open + " Plätze noch frei."}
    ${mine ? ` Du hast ${mine} ${mine === 1 ? "Schicht" : "Schichten"}.` : ""}</p>
    ${block("bar","Bar","16:00 bis 4:00 Uhr, je zwei Stunden zu zweit.")}
    ${block("einlass","Einlass","20:00 bis 2:00 Uhr, je eine Stunde allein.")}`;
}

function guestRow(g) {
  if (ui.editGuest === g.id) {
    return `<li class="card edit">
      <input id="gname" value="${esc(g.name)}" />
      <select id="ghost">${S.hosts.map(h => {
        const used = S.guests.filter(x => x.host_id === h.id && x.id !== g.id).length;
        return `<option value="${h.id}" ${h.id === g.host_id ? "selected" : ""} ${used >= GUEST_LIMIT ? "disabled" : ""}>${esc(h.name)} (${used}/${GUEST_LIMIT})</option>`;
      }).join("")}</select>
      <button class="link" data-act="saveGuest" data-id="${g.id}">Speichern</button>
      <button class="link" data-act="cancelGuest">Abbrechen</button>
    </li>`;
  }
  return `<li class="card">
    <span class="grow">${esc(g.name)}</span>
    <button class="link" data-act="editGuest" data-id="${g.id}">Ändern</button>
    <button class="link" data-act="delGuest" data-id="${g.id}">Entfernen</button>
  </li>`;
}

function hostHead(h, count) {
  if (ui.editHost === h.id) {
    return `<div class="row">
      <input id="hname" value="${esc(h.name)}" />
      <button class="link" data-act="saveHost" data-id="${h.id}">Speichern</button>
      <button class="link" data-act="cancelHost">Abbrechen</button>
    </div>`;
  }
  return `<h3>${esc(h.name)} <span class="count">${count}/${GUEST_LIMIT}</span>
    <button class="link" data-act="editHost" data-id="${h.id}">Umbenennen</button></h3>`;
}

function viewGaeste() {
  const mineList = guestsOf(me);
  const left = GUEST_LIMIT - mineList.length;
  const myHost = S.hosts.find(h => h.id === me);
  const others = S.hosts.filter(h => h.id !== me && guestsOf(h.id).length);
  return `<p class="tally">${S.guests.length} Gäste eingetragen. Du hast noch ${left} von ${GUEST_LIMIT} Plätzen.</p>
  <section class="block">
    <h2>Deine Gäste</h2>
    ${myHost ? hostHead(myHost, mineList.length) : ""}
    <div class="row">
      <input id="guestName" placeholder="Name deines Gasts" ${left <= 0 ? "disabled" : ""} />
      <button class="go" data-act="addGuest" ${left <= 0 ? "disabled" : ""}>Hinzufügen</button>
    </div>
    ${left <= 0 ? `<p class="hint">Deine neun Plätze sind vergeben. Nimm jemanden raus oder schieb ihn auf jemand anderen.</p>` : ""}
    <ul class="cards">${mineList.length ? mineList.map(guestRow).join("") : `<li class="empty">Noch niemand eingeladen.</li>`}</ul>
  </section>
  <section class="block">
    <h2>Gäste der anderen</h2>
    <p class="hint">Alle dürfen hier korrigieren, umhängen und streichen – bitte nur in Absprache.</p>
    ${others.length ? others.map(h => `<div class="group">${hostHead(h, guestsOf(h.id).length)}
      <ul class="cards">${guestsOf(h.id).map(guestRow).join("")}</ul></div>`).join("")
      : `<p class="empty">Noch hat niemand sonst Gäste eingetragen.</p>`}
  </section>`;
}

function viewTodos() {
  const offen = S.todos.filter(t => !t.done);
  const fertig = S.todos.filter(t => t.done);
  const notesOf = id => S.todoNotes.filter(n => n.todo_id === id);
  const wann = ts => {
    const d = new Date(ts);
    return isNaN(d) ? "" : d.toLocaleString("de-DE", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
  };

  const notenBlock = t => {
    const list = notesOf(t.id);
    return `<div class="notes">
      ${list.map(n => `<div class="note">
        <p>${esc(n.body)}</p>
        <span class="noteMeta">${esc(hostName(n.host_id))} · ${wann(n.created_at)}
          <button class="link" data-act="delNote" data-id="${n.id}">löschen</button></span>
      </div>`).join("")}
      ${list.length ? "" : `<p class="empty" style="padding:0 0 6px">Noch keine Notiz zu dieser Aufgabe.</p>`}
      <div class="row" style="margin:6px 0 0">
        <input id="noteInput" placeholder="Notiz schreiben …" />
        <button class="go" data-act="addNote" data-id="${t.id}">Senden</button>
      </div>
    </div>`;
  };

  const verantwortlich = t => {
    const list = ownersOf(t.id);
    return `<div class="owners">
      <span class="by">Verantwortlich:</span>
      ${list.length ? list.map(o => `<span class="pill">${esc(signupName(o))}<button class="link weg" data-act="delOwner" data-id="${o.id}" title="Entfernen">×</button></span>`).join("")
        : `<em class="by">noch niemand</em>`}
      ${ui.addOwnerTo === t.id
        ? `<span class="row" style="margin:0; flex-basis:100%">
             <input id="ownerName" placeholder="Name" />
             <button class="go" data-act="saveOwner" data-id="${t.id}">Eintragen</button>
             <button class="link" data-act="cancelOwner">Abbrechen</button>
           </span>`
        : `<button class="link" data-act="addOwner" data-id="${t.id}">+ Person</button>`}
    </div>`;
  };

  const row = t => {
    if (ui.editTodo === t.id) return `<li class="card edit">
      <input id="tdText" value="${esc(t.text)}" />
      <button class="link" data-act="saveTodo" data-id="${t.id}">Speichern</button>
      <button class="link" data-act="cancelTodo">Abbrechen</button>
    </li>`;
    const n = notesOf(t.id).length;
    const offen = ui.openTodo === t.id;
    return `<li class="card todo col${t.done ? " done" : ""}">
      <div class="todoRow">
        <input type="checkbox" ${t.done ? "checked" : ""} data-act="todo" data-id="${t.id}" />
        <button class="todoMain" data-act="openTodo" data-id="${t.id}">
          <span class="txt">${esc(t.text)}</span>
          <span class="by">von ${esc(hostName(t.done ? (t.done_by || t.created_by) : t.created_by))}${t.done ? " · erledigt" : ""}${ownersOf(t.id).length ? " · für " + ownersOf(t.id).map(o => esc(signupName(o))).join(", ") : ""}${n ? ` · ${n} ${n === 1 ? "Notiz" : "Notizen"}` : ""}</span>
        </button>
        <button class="link" data-act="editTodo" data-id="${t.id}">Ändern</button>
        <button class="link" data-act="delTodo" data-id="${t.id}">Löschen</button>
      </div>
      ${offen ? verantwortlich(t) + notenBlock(t) : ""}
    </li>`;
  };

  return `${meineAufgaben()}
  <section class="block">
    <h2>Alle To-dos</h2>
    <p class="hint">Auf eine Aufgabe tippen öffnet die Notizen dazu.</p>
    <div class="row">
      <input id="todoText" placeholder="Was muss noch passieren?" />
      <button class="go" data-act="addTodo">Hinzufügen</button>
    </div>
    <ul class="cards">${offen.length ? offen.map(row).join("")
      : (fertig.length ? "" : `<li class="empty">Noch nichts offen. Schreib das erste rein.</li>`)}</ul>
    ${fertig.length ? `<h3 class="sub">Erledigt</h3><ul class="cards">${fertig.map(row).join("")}</ul>` : ""}
  </section>`;
}

function meineAufgaben() {
  const meins = S.todos.filter(t => S.owners.some(o => o.todo_id === t.id && o.host_id === me));
  const offen = meins.filter(t => !t.done);
  const fertig = meins.filter(t => t.done);
  const zeile = t => `<li class="card todo${t.done ? " done" : ""}">
    <label><input type="checkbox" ${t.done ? "checked" : ""} data-act="todo" data-id="${t.id}" />
      <span class="txt">${esc(t.text)}</span></label>
  </li>`;
  return `<section class="block">
    <h2>Meine Aufgaben</h2>
    <p class="hint">Alles, wofür du eingetragen bist.</p>
    ${meins.length
      ? `<ul class="cards">${offen.map(zeile).join("")}${fertig.map(zeile).join("")}</ul>`
      : `<p class="empty">Du bist für nichts eingetragen.</p>`}
  </section>`;
}

function viewNotizen() {
  const wann = ts => {
    const d = new Date(ts);
    return isNaN(d) ? "" : d.toLocaleString("de-DE", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
  };
  const kopf = n => `<p>${esc(n.body)}</p>
    <span class="noteMeta">${esc(hostName(n.host_id))} · ${wann(n.created_at)}
      <button class="link" data-act="delBoard" data-id="${n.id}">löschen</button></span>`;

  const oben = S.board.filter(n => !n.parent_id).reverse();
  const antworten = id => S.board.filter(n => n.parent_id === id);

  return `<section class="block">
    <h2>Notizen</h2>
    <p class="hint">Alles, was in keine Liste passt. Einkaufszettel, Absprachen, wer was mitbringt.</p>
    <div class="row">
      <input id="boardInput" placeholder="Notiz schreiben …" />
      <button class="go" data-act="addBoard">Senden</button>
    </div>
    <div class="notes" style="border:none; padding-top:0">
      ${oben.length ? oben.map(n => {
        const kinder = antworten(n.id);
        return `<div class="note">
          ${kopf(n)}
          ${kinder.length ? `<div class="replies">${kinder.map(k => `<div class="note">${kopf(k)}</div>`).join("")}</div>` : ""}
          ${ui.replyTo === n.id
            ? `<div class="row replies" style="margin:8px 0 0">
                 <input id="replyInput" placeholder="Antwort …" />
                 <button class="go" data-act="sendReply" data-id="${n.id}">Senden</button>
                 <button class="link" data-act="cancelReply">Abbrechen</button>
               </div>`
            : `<button class="link" data-act="reply" data-id="${n.id}">Antworten</button>`}
        </div>`;
      }).join("") : `<p class="empty">Noch nichts notiert.</p>`}
    </div>
  </section>`;
}

const sortKey = t => { const [h,m] = (t || "00:00").split(":").map(Number); const v = h*60+m; return v < 720 ? v + 1440 : v; };

function viewDjs() {
  const sorted = [...S.djs].sort((a,b) => sortKey(a.start_time) - sortKey(b.start_time));
  return `<section class="block">
    <h2>DJ-Timetable</h2>
    <p class="hint">Start- und Endzeit frei wählbar. Überschneidungen klärt ihr untereinander.</p>
    <div class="row wrap">
      <input id="djName" class="grow" placeholder="Wer legt auf?" />
      <input id="djStart" type="time" aria-label="Start" />
      <input id="djEnd" type="time" aria-label="Ende" />
      <button class="go" data-act="addDj">Eintragen</button>
    </div>
    <ol class="timetable">${sorted.length ? sorted.map(d => `<li>
      <span class="slotTime">${esc(d.start_time)} – ${esc(d.end_time)}</span>
      <span class="djName">${esc(d.name)}</span>
      <button class="link" data-act="delDj" data-id="${d.id}">Entfernen</button></li>`).join("")
      : `<li class="empty">Noch kein Set eingetragen.</li>`}</ol>
  </section>`;
}

function viewWorkshops() {
  const wann = ts => {
    const d = new Date(ts);
    return isNaN(d) ? "" : d.toLocaleString("de-DE", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
  };
  const komm = id => S.wsNotes.filter(n => n.workshop_id === id);

  return `<section class="block">
    <h2>Workshops</h2>
    <div class="form">
      <input id="wsPerson" placeholder="Name" />
      <input id="wsTitle" placeholder="Titel" />
      <textarea id="wsDesc" rows="3" placeholder="Worum geht's? Was braucht ihr?"></textarea>
      <button class="go wide" data-act="addWs">Workshop eintragen</button>
    </div>
    <p class="hint">Auf einen Workshop tippen öffnet die Kommentare dazu.</p>
    <ul class="cards">${S.workshops.length ? S.workshops.map(w => {
      const list = komm(w.id);
      const offen = ui.openWs === w.id;
      return `<li class="card ws col">
        <div class="todoRow">
          <button class="todoMain" data-act="openWs" data-id="${w.id}">
            <h3>${esc(w.title)}</h3>
            <span class="by">mit ${esc(w.person)}${list.length ? ` · ${list.length} ${list.length === 1 ? "Kommentar" : "Kommentare"}` : ""}</span>
          </button>
          <button class="link" data-act="delWs" data-id="${w.id}">Entfernen</button>
        </div>
        ${w.description ? `<p class="desc">${esc(w.description)}</p>` : ""}
        ${offen ? `<div class="notes">
          ${list.map(n => `<div class="note">
            <p>${esc(n.body)}</p>
            <span class="noteMeta">${esc(hostName(n.host_id))} · ${wann(n.created_at)}
              <button class="link" data-act="delWsNote" data-id="${n.id}">löschen</button></span>
          </div>`).join("")}
          ${list.length ? "" : `<p class="empty" style="padding:0 0 6px">Noch kein Kommentar.</p>`}
          <div class="row" style="margin:6px 0 0">
            <input id="wsNoteInput" placeholder="Kommentar schreiben …" />
            <button class="go" data-act="addWsNote" data-id="${w.id}">Senden</button>
          </div>
        </div>` : ""}
      </li>`;
    }).join("") : `<li class="empty">Noch keine Workshops. Trag deinen ein.</li>`}</ul>
  </section>`;
}

function viewAuslagen() {
  const euro = n => (Number(n) || 0).toFixed(2).replace(".", ",") + " €";
  const datum = d => d ? d.split("-").reverse().join(".") : "";
  const sorted = [...S.expenses].sort((a,b) => (a.spent_on || "").localeCompare(b.spent_on || ""));
  const gesamt = S.expenses.reduce((n,e) => n + Number(e.amount || 0), 0);
  const proKopf = S.hosts.map(h => ({
    name: h.name,
    summe: S.expenses.filter(e => e.host_id === h.id).reduce((n,e) => n + Number(e.amount || 0), 0),
  })).filter(x => x.summe > 0).sort((a,b) => b.summe - a.summe);
  const heute = new Date().toISOString().slice(0,10);

  return `<p class="tally">${gesamt > 0 ? "Bisher " + euro(gesamt) + " ausgelegt." : "Noch nichts ausgelegt."}</p>
  <section class="block">
    <h2>Auslage eintragen</h2>
    <div class="form">
      <select id="exHost">${S.hosts.map(h => `<option value="${h.id}" ${h.id === me ? "selected" : ""}>${esc(h.name)}</option>`).join("")}</select>
      <input id="exWhat" placeholder="Wofür? z. B. Getränke, Lichterketten" />
      <div class="row" style="margin:0">
        <input id="exAmount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Betrag in €" />
        <input id="exDate" type="date" value="${heute}" aria-label="Wann" />
      </div>
      <button class="go wide" data-act="addEx">Eintragen</button>
    </div>
  </section>
  <section class="block">
    <h2>Alle Auslagen</h2>
    <ul class="cards">${sorted.length ? sorted.map(e => `<li class="card">
      <div class="grow"><strong>${esc(e.what)}</strong>
        <p class="by" style="margin:2px 0 0">${esc(hostName(e.host_id))} · ${datum(e.spent_on)}</p></div>
      <span class="betrag">${euro(e.amount)}</span>
      <button class="link" data-act="delEx" data-id="${e.id}">Entfernen</button></li>`).join("")
      : `<li class="empty">Noch keine Auslage eingetragen.</li>`}</ul>
  </section>
  ${proKopf.length ? `<section class="block">
    <h2>Wer hat wie viel ausgelegt</h2>
    <ul class="cards">${proKopf.map(x => `<li class="card">
      <span class="grow">${esc(x.name)}</span><span class="betrag">${euro(x.summe)}</span></li>`).join("")}
      <li class="card"><span class="grow"><strong>Gesamt</strong></span><span class="betrag"><strong>${euro(gesamt)}</strong></span></li>
    </ul></section>` : ""}`;
}

/* ----------------------------- Rendern ----------------------------- */

function render() {
  const focused = document.activeElement?.id;
  const pos = document.activeElement?.selectionStart;
  const vals = {};
  app.querySelectorAll("input, textarea, select").forEach(el => {
    if (el.id && el.type !== "checkbox") vals[el.id] = el.value;
  });

  if (localStorage.getItem("dsch:pw") !== PASSWORT) { app.innerHTML = viewPassword(); return restore(focused, pos, vals); }
  if (!ui.loaded) { app.innerHTML = `<p class="boot">Lade die Party …</p>`; return; }
  if (!me || !S.hosts.some(h => h.id === me)) { app.innerHTML = viewGate(); return restore(focused, pos, vals); }

  const openTodos = S.todos.filter(t => !t.done).length;
  const tabs = [["schichten","Schichten"],["gaeste","Gästeliste"],["todos","To-dos"],["notizen","Notizen"],["djs","DJ-Timetable"],["workshops","Workshops"],["auslagen","Auslagen"]];
  const body = { schichten:viewSchichten, gaeste:viewGaeste, todos:viewTodos, notizen:viewNotizen, djs:viewDjs, workshops:viewWorkshops, auslagen:viewAuslagen }[tab]();

  app.innerHTML = `
    <header class="top">
      <div class="topline"><h1>Tanz im Dschungel</h1>
        <button class="who" data-act="switch">${esc(hostName(me))}<span class="whoHint">wechseln</span></button></div>
    </header>
    <nav class="tabs">${tabs.map(([k,t]) => `<button class="tab${tab === k ? " on" : ""}" data-act="tab" data-tab="${k}">${t}
      ${k === "gaeste" && S.guests.length ? `<span class="badge">${S.guests.length}</span>` : ""}
      ${k === "todos" && openTodos ? `<span class="badge">${openTodos}</span>` : ""}</button>`).join("")}</nav>
    ${tab === "schichten" ? ribbon() : ""}
    ${ui.problem ? `<p class="problem">${ui.problem}</p>` : ""}
    <main>${body}</main>
    <footer class="foot"><span>${ui.busy ? "Speichere …" : "Alle sehen dieselben Listen."}</span>
      <button class="link" data-act="reload">Neu laden</button></footer>`;
  restore(focused, pos, vals);
}

function restore(id, pos, vals) {
  if (vals) {
    for (const key in vals) {
      const el = document.getElementById(key);
      if (el && vals[key] !== "" && el.value === "") el.value = vals[key];
    }
  }
  if (!id) return;
  const el = document.getElementById(id);
  if (!el) return;
  el.focus();
  if (pos != null && el.setSelectionRange) { try { el.setSelectionRange(pos, pos); } catch {} }
}

const val = id => (document.getElementById(id)?.value || "").trim();

// Wert auslesen und Feld leeren – sonst steht der Text nach dem Absenden noch drin.
function take(id) {
  const el = document.getElementById(id);
  if (!el) return "";
  const v = (el.value || "").trim();
  el.value = "";
  return v;
}

/* --------------------------- Interaktion --------------------------- */

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case "pw": {
      if (val("pw") === PASSWORT) { localStorage.setItem("dsch:pw", PASSWORT); render(); load(); }
      else document.getElementById("pwErr").textContent = "Das war nicht das Wort. Frag nochmal in der Gruppe nach.";
      break;
    }
    case "claim": actions.claim(id); break;
    case "newHost": { const n = take("newHost"); if (!n) break;
      const hit = S.hosts.find(h => h.name.toLowerCase() === n.toLowerCase());
      hit ? actions.claim(hit.id) : actions.createHost(n); break; }
    case "switch": actions.claim(null); break;
    case "tab": tab = el.dataset.tab; render(); break;
    case "reload": load(); break;
    case "shift": actions.toggleShift(id); break;
    case "addOther": ui.addTo = id; render(); break;
    case "cancelOther": ui.addTo = null; render(); break;
    case "saveOther": { const n = take("otherName"); if (n) actions.addOther(id, n); else { ui.addTo = null; render(); } break; }
    case "delSignup": actions.removeSignup(id); break;
    case "addGuest": { const n = take("guestName"); if (n) actions.addGuest(n); break; }
    case "editGuest": ui.editGuest = id; render(); break;
    case "cancelGuest": ui.editGuest = null; render(); break;
    case "saveGuest": { const name = val("gname"); const host_id = document.getElementById("ghost").value;
      ui.editGuest = null; if (name) actions.updateGuest(id, { name, host_id }); else render(); break; }
    case "delGuest": actions.deleteGuest(id); break;
    case "editHost": ui.editHost = id; render(); break;
    case "cancelHost": ui.editHost = null; render(); break;
    case "saveHost": { const name = val("hname"); ui.editHost = null;
      if (name) actions.renameHost(id, name); else render(); break; }
    case "addTodo": { const t = take("todoText"); if (t) actions.addTodo(t); break; }
    case "todo": actions.toggleTodo(id); break;
    case "delTodo": actions.deleteTodo(id); break;
    case "editTodo": ui.editTodo = id; render(); break;
    case "cancelTodo": ui.editTodo = null; render(); break;
    case "saveTodo": { const t = val("tdText"); ui.editTodo = null;
      if (t) actions.updateTodo(id, t); else render(); break; }
    case "addDj": { const n = val("djName"), s = val("djStart"), t = val("djEnd");
      if (!n || !s || !t) break;
      take("djName"); take("djStart"); take("djEnd");
      actions.addDj(n, s, t); break; }
    case "delDj": actions.deleteDj(id); break;
    case "addWs": { const p = val("wsPerson"), t = val("wsTitle"), d = val("wsDesc");
      if (!p || !t) break;
      take("wsPerson"); take("wsTitle"); take("wsDesc");
      actions.addWorkshop(p, t, d); break; }
    case "delWs": actions.deleteWorkshop(id); break;
    case "openWs": ui.openWs = ui.openWs === id ? null : id; render(); break;
    case "addWsNote": { const b = take("wsNoteInput"); if (b) actions.addWsNote(id, b); break; }
    case "delWsNote": actions.deleteWsNote(id); break;
    case "openTodo": ui.openTodo = ui.openTodo === id ? null : id; render(); break;
    case "addNote": { const b = take("noteInput"); if (b) actions.addNote(id, b); break; }
    case "delNote": actions.deleteNote(id); break;
    case "addOwner": ui.addOwnerTo = id; render(); break;
    case "cancelOwner": ui.addOwnerTo = null; render(); break;
    case "saveOwner": { const n = take("ownerName"); if (n) actions.addOwner(id, n); else { ui.addOwnerTo = null; render(); } break; }
    case "delOwner": actions.removeOwner(id); break;
    case "addBoard": { const b = take("boardInput"); if (b) actions.addBoardNote(b); break; }
    case "delBoard": actions.deleteBoardNote(id); break;
    case "reply": ui.replyTo = id; render(); break;
    case "cancelReply": ui.replyTo = null; render(); break;
    case "sendReply": { const b = take("replyInput"); if (b) actions.addBoardNote(b, id); else { ui.replyTo = null; render(); } break; }
    case "addEx": {
      const host_id = document.getElementById("exHost")?.value;
      const what = val("exWhat"), amount = val("exAmount"), spent_on = val("exDate");
      if (!host_id || !what) break;
      take("exWhat"); take("exAmount");
      actions.addExpense(host_id, what, amount === "" ? null : Number(amount.replace(",", ".")), spent_on || null);
      break; }
    case "delEx": actions.deleteExpense(id); break;
  }
});

document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.tagName === "TEXTAREA") return;
  const map = { pw:"pw", newHost:"newHost", guestName:"addGuest", todoText:"addTodo" };
  const act = map[e.target.id];
  if (act) { e.preventDefault(); document.querySelector(`[data-act="${act}"]`)?.click(); }
  if (e.target.id === "gname") document.querySelector('[data-act="saveGuest"]')?.click();
  if (e.target.id === "tdText") document.querySelector('[data-act="saveTodo"]')?.click();
  if (e.target.id === "noteInput") document.querySelector('[data-act="addNote"]')?.click();
  if (e.target.id === "boardInput") document.querySelector('[data-act="addBoard"]')?.click();
  if (e.target.id === "replyInput") document.querySelector('[data-act="sendReply"]')?.click();
  if (e.target.id === "otherName") document.querySelector('[data-act="saveOther"]')?.click();
  if (e.target.id === "wsNoteInput") document.querySelector('[data-act="addWsNote"]')?.click();
  if (e.target.id === "ownerName") document.querySelector('[data-act="saveOwner"]')?.click();
  if (e.target.id === "hname") document.querySelector('[data-act="saveHost"]')?.click();
});

document.addEventListener("input", e => {
});

// Nicht aktualisieren, solange jemand tippt oder etwas Halbfertiges im Feld steht.
function amTippen() {
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT")) return true;
  return [...app.querySelectorAll("input, textarea")]
    .some(el => el.type !== "checkbox" && el.value.trim() !== "");
}

setInterval(() => {
  if (document.visibilityState !== "visible") return;
  if (ui.busy || ui.editGuest || ui.editHost || ui.editTodo || ui.replyTo || ui.addTo || ui.addOwnerTo || amTippen()) return;
  load();
}, 60000);

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !amTippen()) load();
});

if (localStorage.getItem("dsch:pw") === PASSWORT) load(); else render();
</script>
</body>
</html>
